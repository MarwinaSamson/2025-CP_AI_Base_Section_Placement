<div class="space-y-6 animate-fadeIn">
    <!-- Statistics -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-gradient-to-br from-amber-500 via-amber-600 to-amber-700 rounded-2xl p-8 text-white shadow-xl transform hover:scale-105 transition-transform duration-300 border-2 border-amber-400">
            <div class="flex items-center justify-between mb-4">
                <div class="w-16 h-16 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
                    <i class="fas fa-clock text-4xl"></i>
                </div>
                <div class="text-right">
                    <span class="text-5xl font-black" id="pendingCount">0</span>
                </div>
            </div>
            <p class="text-amber-100 text-base font-bold uppercase tracking-wide">Pending Review</p>
            <div class="mt-3 h-1 bg-white/30 rounded-full">
                <div class="h-full bg-white rounded-full" style="width: 60%"></div>
            </div>
        </div>
        <div class="bg-gradient-to-br from-green-500 via-green-600 to-green-700 rounded-2xl p-8 text-white shadow-xl transform hover:scale-105 transition-transform duration-300 border-2 border-green-400">
            <div class="flex items-center justify-between mb-4">
                <div class="w-16 h-16 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
                    <i class="fas fa-check-circle text-4xl"></i>
                </div>
                <div class="text-right">
                    <span class="text-5xl font-black" id="approvedCount">0</span>
                </div>
            </div>
            <p class="text-green-100 text-base font-bold uppercase tracking-wide">Approved</p>
            <div class="mt-3 h-1 bg-white/30 rounded-full">
                <div class="h-full bg-white rounded-full" style="width: 40%"></div>
            </div>
        </div>
        <div class="bg-gradient-to-br from-red-500 via-primary to-primary-dark rounded-2xl p-8 text-white shadow-xl transform hover:scale-105 transition-transform duration-300 border-2 border-red-400">
            <div class="flex items-center justify-between mb-4">
                <div class="w-16 h-16 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
                    <i class="fas fa-layer-group text-4xl"></i>
                </div>
                <div class="text-right">
                    <span class="text-5xl font-black" id="sectionsCount">0</span>
                </div>
            </div>
            <p class="text-red-100 text-base font-bold uppercase tracking-wide">Available Sections</p>
            <div class="mt-3 h-1 bg-white/30 rounded-full">
                <div class="h-full bg-white rounded-full" style="width: 80%"></div>
            </div>
        </div>
    </div>

    <!-- Enrollment Requests Table -->
    <div class="bg-white rounded-2xl shadow-xl border-2 border-gray-200 overflow-hidden">
        <div class="bg-gradient-to-r from-gray-50 to-white p-6 border-b-2 border-gray-200">
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="fas fa-clipboard-list text-primary"></i>
                        Enrollment Requests
                    </h3>
                    <p class="text-sm text-gray-600 mt-1">Review and process student applications</p>
                </div>
                <div class="flex items-center gap-3">
                    <select id="statusFilter" class="px-5 py-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary font-semibold text-gray-700 bg-white">
                        <option value="all">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                    </select>
                    <button id="exportBtn" class="px-3 py-3 rounded-xl bg-white border-2 border-gray-300 hover:bg-gray-100 text-gray-700" title="Export">
                        <i class="fas fa-file-export"></i>
                    </button>
                    <button id="printBtn" class="px-3 py-3 rounded-xl bg-white border-2 border-gray-300 hover:bg-gray-100 text-gray-700" title="Print">
                        <i class="fas fa-print"></i>
                    </button>
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" placeholder="Search by name or LRN..." class="pl-10 pr-4 py-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all w-64" />
                    </div>
                </div>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full" id="enrollmentTable">
                <thead class="bg-gradient-to-r from-primary to-primary-dark text-white">
                    <tr>
                        <th class="px-6 py-4 text-left font-semibold">Student Name</th>
                        <th class="px-6 py-4 text-left font-semibold">LRN</th>
                        <th class="px-6 py-4 text-left font-semibold">Status</th>
                        <th class="px-6 py-4 text-left font-semibold">Actions</th>
                    </tr>
                </thead>
                <tbody id="enrollmentTableBody" class="divide-y divide-gray-200">
                    <!-- Populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>
