{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="{% static 'images/westLogo.png' %}" />
    <title>{% block title %}Admin Portal{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'admin_app/styles.css' %}" />
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}

    <!-- Session Expired Modal -->
    <div
      id="sessionExpiredModal"
      class="fixed inset-0 z-[999] hidden overflow-y-auto"
    >
      <div class="flex items-center justify-center min-h-screen px-4">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75"></div>
        <div
          class="relative bg-white rounded-2xl shadow-xl p-8 max-w-md w-full z-10 animate-modal-fade-in"
        >
          <div class="flex justify-center mb-6">
            <div
              class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center"
            >
              <i class="fas fa-clock text-yellow-500 text-3xl"></i>
            </div>
          </div>
          <h3
            class="text-center font-display text-2xl font-bold text-gray-800 mb-2"
          >
            Session Expired
          </h3>
          <p class="text-center text-gray-500 mb-8">
            Your session has expired due to inactivity. Please log in again to
            continue.
          </p>
          <button
            onclick="window.location.href = '/admin-portal/login/'"
            class="w-full bg-gradient-to-r from-primary to-primary-dark text-white font-semibold py-3 px-6 rounded-lg hover:shadow-lg transition-all duration-300 flex items-center justify-center gap-2"
          >
            <i class="fas fa-sign-in-alt"></i>
            Log In Again
          </button>
        </div>
      </div>
    </div>

    <script>
      // Unified Session Expired Modal and Polling Logic
      (function () {
        const SESSION_STATUS_URL = "/session-status/";
        let hasShownModal = false;

        function showSessionExpiredModal() {
          if (hasShownModal) return;
          hasShownModal = true;
          document
            .getElementById("sessionExpiredModal")
            .classList.remove("hidden");
        }

        async function checkSessionStatus() {
          try {
            const res = await fetch(SESSION_STATUS_URL, {
              credentials: "same-origin",
              headers: { "X-Requested-With": "XMLHttpRequest" },
            });
            if (res.status === 401 || res.status === 403) {
              showSessionExpiredModal();
              return;
            }
            const data = await res.json();
            if (data && data.authenticated === false) {
              showSessionExpiredModal();
            }
          } catch (e) {
            showSessionExpiredModal();
          }
        }

        // Poll every 10 seconds (for testing)
        setInterval(checkSessionStatus, 10000);
        // Also check when user returns to tab
        window.addEventListener("focus", checkSessionStatus);

        // Intercept every click BEFORE navigation happens
        document.addEventListener(
          "click",
          async function (e) {
            const anchor = e.target.closest("a[href]");
            if (!anchor) return;
            const href = anchor.getAttribute("href");
            if (!href || href.startsWith("#") || href.includes("logout"))
              return;

            try {
              const res = await fetch(SESSION_STATUS_URL, {
                credentials: "same-origin",
                headers: { "X-Requested-With": "XMLHttpRequest" },
              });
              if (res.status === 401 || res.status === 403) {
                e.preventDefault();
                e.stopImmediatePropagation();
                showSessionExpiredModal();
              }
            } catch (e) {}
          },
          true,
        );
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
